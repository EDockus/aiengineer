# Lint and type-check configuration for the sample Function App. There is no package to
# build here -- Azure Functions deploys the directory as-is -- so this file exists only
# so `ruff check .` and `mypy --strict .` run with the same settings as agent/.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "PTH", "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["azure.functions.*"]
ignore_missing_imports = true
